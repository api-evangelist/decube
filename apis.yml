apis:
- name: Decube Public API
  description: The Decube Public API (BETA, v1) exposes a Data API (assets, glossary, lineage, monitors,
    ACL, reports, recon, custom attributes, virtual sources) and a Control API (users) for automating
    data catalog, quality, lineage, and access-control workflows. Authenticated with an X-Decube-Api-Key
    header against regional endpoints (us-1, apac).
