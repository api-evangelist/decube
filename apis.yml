name: Decube
description: Decube is a unified data trust platform that combines data observability, discovery, cataloging,
  and governance for regulated industries such as banking, financial services, insurance, and telecom. It
  provides metadata management, column-level lineage, data quality monitoring, anomaly and schema-change
  detection, decentralized data products, and pipeline observability, plus Trusty AI for governed data
  context. Decube exposes a BETA Public REST API (a Data API and a Control API) authenticated with an
  X-Decube-Api-Key header across regional endpoints, a webhooks integration for incident alerts, and a
  fully hosted MCP server (OAuth) so AI clients can search the catalog, inspect lineage, manage monitors,
  and act on incidents.
